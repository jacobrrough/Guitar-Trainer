<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Free, open-source guitar trainer: play along to your own songs with adjustable difficulty, plus a tuner and metronome. Runs entirely in your browser." />
    <!-- iOS home-screen app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guitar Trainer" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Guitar Trainer</title>
    <style>
      /* Dark first paint: a home-screen launch shows the page background before the CSS bundle loads. */
      html { background: #0b0f17; }
      /* iOS zooms the page when a focused field has a font size under 16px (and does not zoom back in a standalone app). */
      @supports (-webkit-touch-callout: none) {
        input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="file"]),
        select,
        textarea { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
