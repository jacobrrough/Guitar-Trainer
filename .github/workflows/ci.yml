name: CI & Deploy

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Runs only wait behind runs for the same branch or pull request, so work on one branch can never
# push a queued default-branch run (the one that publishes) out of the queue. A newer push replaces
# an older run of the same branch, except on the default branch, where a run may be half way
# through publishing and must be left to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: dist

  deploy:
    # Publishes the default branch to GitHub Pages at https://<owner>.github.io/<repo>/.
    # configure-pages switches Pages on by itself when it can; otherwise enable it once under
    # Settings → Pages → Source: GitHub Actions and re-run the workflow.
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    # One publish at a time, never cut off half way.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
